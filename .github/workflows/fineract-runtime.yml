name: Fineract runtime controller
on:
  pull_request:
    paths:
      - 'outer/**'
      - 'docs/fineract-runtime.md'
      - '.github/workflows/fineract-runtime.yml'
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile public runtime
        run: python -m compileall -q outer/fineract outer/harness
      - name: Test controller and preserved historical paths
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s outer/tests -q
